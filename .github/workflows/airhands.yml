name: AirHands (macOS app)
on:
  push:
    # Listing tags alone would stop branch pushes from triggering, so list both.
    branches: ["**"]
    tags: ["airhands-v*"]
    paths: ["airhands/**", ".github/workflows/airhands.yml"]
  pull_request:
    paths: ["airhands/**", ".github/workflows/airhands.yml"]
  workflow_dispatch:
permissions:
  contents: write   # only used to create a Release on airhands-v* tags
jobs:
  build-test-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: airhands
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core unit tests (swift test)
        run: ./scripts/test.sh
      - name: Tests via Xcode scheme
        run: |
          set -o pipefail
          ./scripts/test.sh --xcode --adhoc
      - name: Package AirHands.app (Release, universal)
        run: |
          set -o pipefail
          ./scripts/package.sh --adhoc
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AirHands
          path: airhands/build/dist/AirHands.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/airhands-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/AirHands.zip \
            --title "AirHands ${GITHUB_REF_NAME#airhands-v}" \
            --notes-file INSTALL.md
