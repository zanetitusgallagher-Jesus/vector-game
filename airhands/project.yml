# XcodeGen spec. Generate the project with ./scripts/generate.sh (never edit the .xcodeproj).
name: AirHands
options:
  bundleIdPrefix: dev.airhands
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/AirHands.xcconfig
  Release: Config/AirHands.xcconfig

packages:
  AirHandsCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AirHands:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "AirHands.entitlements"
    dependencies:
      - package: AirHandsCore
        product: AirHandsCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AirHands
        CFBundleName: AirHands
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSCameraUsageDescription: "AirHands watches your hands through the camera so you can control your Mac with gestures. Video is processed on this Mac only and is never stored or sent anywhere."
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/AirHands.entitlements
      properties:
        # Not sandboxed: posting CGEvents and the Accessibility API need it.
        com.apple.security.app-sandbox: false
        # Hardened runtime requires an explicit camera entitlement.
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_NAME: AirHands
        PRODUCT_BUNDLE_IDENTIFIER: "$(AIRHANDS_BUNDLE_ID)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES

schemes:
  AirHands:
    build:
      targets:
        AirHands: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AirHandsCore/AirHandsCoreTests
