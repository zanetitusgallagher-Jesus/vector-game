# Generate Anchor.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: Anchor
options:
  bundleIdPrefix: app.anchor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AnchorCore:
    path: AnchorCore

targets:
  Anchor:
    type: application
    platform: macOS
    sources:
      - path: Anchor
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Anchor.entitlements"
      # Folder references keep Bibles/ and Plans/ as subdirectories in the bundle.
      - path: Anchor/Resources/Bibles
        type: folder
        buildPhase: resources
      - path: Anchor/Resources/Plans
        type: folder
        buildPhase: resources
    dependencies:
      - package: AnchorCore
    info:
      path: Anchor/Info.plist
      properties:
        CFBundleDisplayName: Anchor
        CFBundleName: Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar app: no Dock icon except while windows need one.
        LSUIElement: true
        NSHumanReadableCopyright: Scripture text: KJV and WEB, public domain.
    entitlements:
      path: Anchor/Anchor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anchor.Anchor
        PRODUCT_NAME: Anchor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  AnchorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AnchorTests
    dependencies:
      - target: Anchor
      - package: AnchorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anchor.AnchorTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Anchor.app/Contents/MacOS/Anchor
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Anchor:
    build:
      targets:
        Anchor: all
        AnchorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnchorTests
        - package: AnchorCore/AnchorCoreTests
